<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="zestyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C" />
      <stop offset="50%" stop-color="#FF6B3D" />
      <stop offset="100%" stop-color="#FC9446" />
    </linearGradient>
    <linearGradient id="zestyGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE17D" />
      <stop offset="100%" stop-color="#FF385C" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Container with rounded squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" ry="112" fill="url(#zestyGrad)" />

  <!-- Zesty Lightning / Z Flame / Play Emblem -->
  <g transform="translate(4, 4)">
    <!-- Main Z Ribbon -->
    <path d="M 140 145 H 370 C 385 145 395 158 388 171 L 225 330 H 370 C 385 330 395 343 388 356 C 382 367 371 373 358 373 H 135 C 120 373 110 360 117 347 L 280 188 H 140 C 125 188 115 175 122 162 C 128 151 139 145 140 145 Z" fill="#FFFFFF" filter="url(#glow)" />
    
    <!-- Sparkle / Lemon Zest Accent Top Right -->
    <path d="M 390 120 C 400 135 410 135 425 145 C 410 155 400 155 390 170 C 380 155 370 155 355 145 C 370 135 380 135 390 120 Z" fill="#FFE17D" />
    
    <!-- Play Triangle Overlay (symbolizing Reel/Video) -->
    <polygon points="230,230 230,290 280,260" fill="url(#zestyGrad)" />
  </g>
</svg>